# Registro de supuestos de Rastrojo (fuente de verdad legible por máquina).
# La tabla para humanos está en docs/assumptions.md. Editable por agrónomos de AFA:
# cambiar un valor cambia el input_hash de las evaluaciones que lo usan.
# Todos los valores son EJEMPLOS pendientes de validación salvo que status diga VALIDATED.

- assumption_id: A-CLI-01
  description: Límites de las ventanas de invierno y verano de la campaña (sur de Santa Fe)
  value:
    winter: {start: "05-01", end: "10-31", crosses_year: false}
    summer: {start: "11-01", end: "03-31", crosses_year: true}
  unit: mes-día
  reference: pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-02
  description: Máximo de días faltantes de lluvia por ventana para incluir un año
  value: 0
  unit: días
  reference: criterio del equipo, pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-03
  description: Mínimo de años válidos para clasificar una ventana
  value: 15
  unit: años
  reference: convención de climatologías cortas, pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-04
  description: Diferencia relativa POWER vs IMERG que dispara advertencia
  value: 25
  unit: "%"
  reference: criterio del equipo
  status: PENDING_AFA

- assumption_id: A-CLI-05
  description: Umbral de T2M_MIN (temperatura a 2 m de la celda POWER) que cuenta como helada
  value: 0.0
  unit: degC
  reference: criterio del equipo, pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-06
  description: Ventanas sensibles a helada por cultivo, en días después de la siembra (trigo espigazón-floración; soja y maíz emergencia)
  value:
    WHEAT: [95, 140]
    SOY_1ST: [0, 30]
    SOY_2ND: [0, 30]
    MAIZE_EARLY: [0, 30]
    MAIZE_LATE: [0, 30]
  unit: días después de siembra
  reference: pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-07
  description: Frecuencias que separan severidad LOW, MEDIUM y HIGH de helada y de cada evento del calendario de vulnerabilidad
  value: {medium: 0.1, high: 0.3}
  unit: fraction
  reference: criterio del equipo
  status: PENDING_AFA

- assumption_id: A-CLI-08
  description: Umbral de T2M_MAX para estrés térmico en floración
  value: 35.0
  unit: degC
  reference: pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-09
  description: Ventanas de floración por cultivo de renta, en días después de la siembra
  value:
    WHEAT: [95, 125]
    SOY_1ST: [60, 95]
    SOY_2ND: [50, 85]
    MAIZE_EARLY: [100, 130]
    MAIZE_LATE: [70, 100]
  unit: días después de siembra
  reference: pendiente AFA
  status: PENDING_AFA

- assumption_id: A-CLI-10
  description: Percentil de lluvia diaria IMERG (sobre días con lluvia) que define lluvia extrema
  value: 0.95
  unit: fraction
  reference: criterio del equipo, pendiente AFA
  status: PENDING_AFA

- assumption_id: A-AGR-01
  description: Calendario de cultivos del sur de Santa Fe, fecha representativa de siembra y cosecha (mes-día; +1 = año siguiente al de inicio de campaña). Los servicios terminan según A-WAT-09
