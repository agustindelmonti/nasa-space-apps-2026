    WHEAT: {sow: "06-10", harvest: "12-05"}
    SOY_1ST: {sow: "11-10", harvest: "+1-04-10"}
    SOY_2ND: {sow: "12-15", harvest: "+1-04-25"}
    MAIZE_EARLY: {sow: "09-25", harvest: "+1-03-15"}
    MAIZE_LATE: {sow: "12-15", harvest: "+1-05-30"}
    COVER_VETCH: {sow: "05-05", harvest: "10-15"}
    COVER_RYE: {sow: "05-05", harvest: "10-15"}
    COVER_OAT: {sow: "05-05", harvest: "10-15"}
  unit: mes-día
  reference: valores de referencia del equipo, pendiente AFA
  status: PENDING_AFA

