      COVER_RYE: [0.30, 1.10, 0.90]
      COVER_OAT: [0.30, 1.10, 0.90]
  unit: adimensional
  reference: FAO-56 Tabla 12 para soja, maíz y trigo; servicios aproximados (pendiente AFA); fracciones de etapa y Kc de barbecho son simplificaciones del equipo
  status: PENDING_AFA

