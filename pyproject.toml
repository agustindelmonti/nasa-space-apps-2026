[project]
name = "rastrojo"
version = "0.1.0"
description = "Comparador determinista de rotaciones de cultivo con datos NASA para la zona núcleo (NASA Space Apps 2026, Rosario)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Núcleo liviano (motor, explicaciones, agente y API): corre sin pandas usando el snapshot de clima.
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
# Ingesta de datos NASA (POWER, parquet, validación). Se instala por defecto en desarrollo.
data = [
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20261113",
    "pandas-stubs>=3.1.0.261029",
    "pyarrow-stubs>=20.0.0.20260819",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "data"]

[tool.hatch.build.targets.wheel]
packages = ["src/rastrojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format maneja el largo; los mensajes en español pueden excederlo

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/rastrojo/domain", "src/rastrojo/engine", "src/rastrojo/application", "src/rastrojo/adapters", "src/rastrojo/data"]
